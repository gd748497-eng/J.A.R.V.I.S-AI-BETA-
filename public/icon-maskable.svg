<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082f49" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#020617" stop-opacity="1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="coreGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="90%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="#020617" />
  <circle cx="256" cy="256" r="210" fill="url(#bgGlowM)" stroke="#0e7490" stroke-width="2" stroke-opacity="0.5" />

  <!-- Content scaled inside 80% safe zone (center 256, radius <= 180) -->
  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <!-- Outer Tech Ring & Ticks -->
    <circle cx="256" cy="256" r="216" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 14" opacity="0.6" />
    <circle cx="256" cy="256" r="198" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.4" />
    <circle cx="256" cy="256" r="182" fill="none" stroke="#06b6d4" stroke-width="5" stroke-dasharray="40 18 10 18" filter="url(#glowM)" />

    <!-- Hexagonal Tech Cage -->
    <polygon points="256,92 398,174 398,338 256,420 114,338 114,174" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="16 8" />

    <!-- Intermediate Ring -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-dasharray="28 20" opacity="0.85" />
    <circle cx="256" cy="256" r="124" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8" />

    <!-- Radial Spokes -->
    <g stroke="#22d3ee" stroke-width="4" opacity="0.8" filter="url(#glowM)">
      <line x1="256" y1="132" x2="256" y2="178" />
      <line x1="256" y1="334" x2="256" y2="380" />
      <line x1="132" y1="256" x2="178" y2="256" />
      <line x1="334" y1="256" x2="380" y2="256" />
      <line x1="168" y1="168" x2="202" y2="202" />
      <line x1="310" y1="310" x2="344" y2="344" />
      <line x1="344" y1="168" x2="310" y2="202" />
      <line x1="202" y1="310" x2="168" y2="344" />
    </g>

    <!-- Glowing Inner Arc Reactor Core -->
    <circle cx="256" cy="256" r="82" fill="#030712" stroke="#00f0ff" stroke-width="4" filter="url(#glowM)" />
    <circle cx="256" cy="256" r="62" fill="url(#coreGlowM)" filter="url(#glowM)" />
    <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glowM)" />

    <!-- Tri-Arc Energy Field Overlay -->
    <path d="M 256 186 A 70 70 0 0 1 316.6 291 L 292 276.8 A 42 42 0 0 0 256 214 Z" fill="#38bdf8" opacity="0.65" />
    <path d="M 316.6 291 A 70 70 0 0 1 195.4 291 L 220 276.8 A 42 42 0 0 0 292 276.8 Z" fill="#06b6d4" opacity="0.65" />
    <path d="M 195.4 291 A 70 70 0 0 1 256 186 L 256 214 A 42 42 0 0 0 220 276.8 Z" fill="#22d3ee" opacity="0.65" />
  </g>
</svg>
